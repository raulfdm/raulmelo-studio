packages:
  - website
  - website-new
  - packages/*
  - cms

# Bun 1.4.3 reports Node 26.3.0 compatibility; pnpm's native CLI cannot
# detect that version when no Node.js runtime is installed. This is for engine checks.
nodeVersion: 26.3.0
autoInstallPeers: true
strictPeerDependencies: false
savePrefix: ''
engineStrict: true

catalog:
  '@types/bun': 1.4.3
  eslint: 10.13.0
  prettier: 3.9.10
  typescript: 6.0.3
  tsdown: 0.23.1
  vitest: 5.0.5
  zod: 4.6.7

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
overrides:
  # Sanity CLI and Vercel still resolve vulnerable releases of these packages.
  'js-yaml@3.13.1': 3.15.2
  'path-to-regexp@6.1.0': 6.3.0
  'smol-toml@1.5.2': 1.9.1
minimumReleaseAgeExclude:
  - '@lucide/svelte@1.60.0'
  - '@sanity/access-ui@6.20.0'
  - '@sanity/diff@6.20.0'
  - '@sanity/mutator@6.20.0'
  - '@sanity/schema@6.20.0'
  - '@sanity/types@6.20.0'
  - '@sanity/util@6.20.0'
  - '@sanity/validation@6.20.0'
  - '@sanity/vision@6.20.0'
  - sanity@6.20.0
  - groq@6.20.0
patchedDependencies:
  # Sanity CLI streams the Studio upload, but get-it 9 rejects Node streams.
  # Remove when the CLI sends a supported request body upstream.
  '@sanity/cli@8.20.0': patches/@sanity__cli@8.20.0.patch
