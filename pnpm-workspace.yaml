packages:
  - website
  - website-new
  - packages/*
  - cms

# Bun 1.4.3 exposes Node-compatible APIs; pnpm's native CLI cannot detect
# that version when no Node.js runtime is installed. This is for engine checks.
nodeVersion: 24.3.0
autoInstallPeers: true
strictPeerDependencies: false
savePrefix: ''
engineStrict: true

catalog:
  '@types/bun': 1.4.3
  eslint: 9.34.0
  prettier: 3.9.10
  typescript: 5.9.2
  tsdown: 0.18.2
  vitest: 3.2.4
  zod: 3.25.76

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
