name: 'Mise setup'
description: 'Install the runtimes declared in mise.toml'
runs:
  using: 'composite'
  steps:
    - uses: jdx/mise-action@v5
      with:
        version: 2026.10.15
    - name: Use Bun for Node-compatible package scripts
      shell: bash
      run: echo "$GITHUB_WORKSPACE/scripts/bin" >> "$GITHUB_PATH"
