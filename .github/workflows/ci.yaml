name: CI

on: [push]

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git files setup
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/mise

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: CI checks
        run: pnpm turbo lint test build
        env:
          APP_ENV: local
          # The build now generates every page, so it needs real read access to
          # Sanity. ALGOLIA_ADMIN_KEY is only read by the reindex script.
          SANITY_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          ALGOLIA_ADMIN_KEY: xxx
