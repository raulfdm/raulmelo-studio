name: CI

on: [push]

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git files setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/mise

      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install

      - name: CI checks
        run: bun run --bun turbo lint typecheck test build
        env:
          APP_ENV: local
          # The build now generates every page, so it needs real read access to
          # Sanity. ALGOLIA_ADMIN_KEY is only read by the reindex script.
          SANITY_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          ALGOLIA_ADMIN_KEY: xxx
