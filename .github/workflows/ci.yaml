name: CI

# Pushes to main are built by the Deployment workflow, and every full build
# fetches the whole site from Sanity. So the build runs once per pull request
# update, not on every push to every branch.
on:
  pull_request:
  push:
    branches:
      - main

env:
  CI: true
  TURBO_API: https://turbo-cache.raulmelo.dev
  TURBO_TEAM: raulmelo.me
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  CONTENT_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Git files setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/mise

      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install

      # Saved by the Deployment workflow; restoring it here means the build
      # reuses already-downloaded images instead of fetching them from Sanity.
      - name: Restore Astro images
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.astro
          key: astro-assets-${{ github.run_id }}
          restore-keys: |
            astro-assets-

      - name: CI checks
        run: bun run --bun turbo lint typecheck test ${{ github.event_name == 'pull_request' && 'build' || '' }} --filter='!astro-latest'
        env:
          APP_ENV: local
          # The build now generates every page, so it needs real read access to
          # Sanity. ALGOLIA_ADMIN_KEY is only read by the reindex script.
          SANITY_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          ALGOLIA_ADMIN_KEY: xxx
