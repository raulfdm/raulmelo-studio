name: Deployment
on:
  push:
    branches:
      - main
      - docker-go

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

permissions: "write-all"

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and tags
        id: meta
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./website/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max,ignore-error=true
          build-args: |
            CONTENT_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
          # The site is now generated at image build time, so the build needs
          # real read access to Sanity.
          secrets: |
            sanity_token=${{ secrets.SANITY_AUTH_TOKEN }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Trigger Deployment
        run: |
          curl -X 'POST' \
          'https://raulmelo.dev/api/application.deploy' \
          -H 'accept: application/json' \
          -H 'x-api-key: ${{ secrets.WEBSITE_DEPLOY_API_KEY }}' \
          -H 'Content-Type: application/json' \
          -d '{
            "applicationId": "${{ secrets.WEBSITE_DEPLOY_APP_ID }}"
          }'

  # Replaces the `/api/webhooks/update-algolia` endpoint, which the static
  # build can no longer host.
  reindex-algolia:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/mise

      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install

      - name: Rebuild the Algolia index
        run: pnpm --filter website reindex:algolia
        env:
          APP_ENV: production
          SANITY_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
