name: Playwright Tests

on: workflow_dispatch

env:
  TURBO_API: https://turbo-cache.raulmelo.dev
  TURBO_TEAM: raulmelo.me
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Git files setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/mise

      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install

      - name: Install Playwright Browsers
        run: bun run --bun --cwd website-new playwright install --with-deps

      - name: Run Playwright tests
        run: bun run --bun turbo test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./website-new/playwright-report/
          retention-days: 30
