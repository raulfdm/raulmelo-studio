name: Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - 'website-new/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/actions/**'
      - 'scripts/bin/**'
  pull_request:
    paths:
      - 'website-new/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/actions/**'
      - 'scripts/bin/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Git files setup
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/mise

      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install

      - name: Install Playwright Browsers
        run: bun run --bun --cwd website-new playwright install --with-deps

      - name: Run Playwright tests
        run: bun run --bun turbo test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./website-new/playwright-report/
          retention-days: 30
